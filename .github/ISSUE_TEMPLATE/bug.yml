name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Drag `photo.heic` with ⌥ held and drop it on …
        2. Type …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Westron version
      description: From the release you installed, or `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Operating system and version
      placeholder: macOS 26.1 (Apple M3)
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, the input file (if you can share it), `westron formats <file>` output
      description: Leave out anything private.
